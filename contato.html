<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneakerStore - Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">👟 SneakerStore</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="produtos.html">Produtos</a>
            <a href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
            <a href="contato.html" class="active">Contato</a>
            <a href="mensagens.php">Painel Admin</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Fale Conosco / Dúvidas sobre Pedidos</h2>
            <br>
            <form id="formContato" action="processa_contato.php" method="POST">
                <input type="hidden" name="acao" value="cadastrar">
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail de Contato:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" name="assunto" required>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SneakerStore - Todos os direitos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
